# Five jobs, all on standard GitHub-hosted runners so a public repo pays
# nothing. Do NOT switch any of these to a larger runner: those are billed
# even on public repositories.
#
# The point of each job:
#   server         — the record/store tests pin the on-flash wire format
#                    against real captured fixtures. It BUILDS THE PWA first,
#                    and that is not incidental: internal/web/dist is
#                    gitignored, so in a clean checkout go:embed has no
#                    index.html and web.Handler() serves its own 404 instead
#                    of the SPA fallback. TestSiteRootAnswers200WithoutTheMarker
#                    asserts that a misconfigured non-/api/ POST answers 200
#                    with HTML — the whole reason the X-Espressolog-Ingest
#                    marker exists — and without the build that premise is
#                    absent and the test fails. It passed on a developer
#                    machine, where dist is left populated by `make web`, and
#                    was broken for FOUR commits -- f26a2c8^..16f5b76, i.e.
#                    f26a2c8 (which introduced the assertion), 5941a55,
#                    389743c, 16f5b76. Only THREE runs failed: 5941a55 was
#                    pushed together with 389743c, so only the tip got a run.
#                    Quote the inclusive range; `f26a2c8..16f5b76` excludes the
#                    commit that broke it and sends a bisect one commit late.
#   firmware-logic — detector_test.cpp encodes every real-world shot loss as
#                    a scenario. These are the tests that exist because a shot
#                    was actually lost, and they are the reason not to lose it
#                    twice. display_test.cpp does the same against real frames
#                    recorded off the machine.
#   firmware-build — the only check that the firmware still *compiles*. The
#                    host tests build the pure-logic files with a host
#                    compiler and never touch the Arduino toolchain, so
#                    nothing else would catch a break there.
#   facts          — THE NEWEST JOB, and the only one that guards prose.
#                    This repo's most-logged defect is a number corrected in
#                    one file while a stale copy survives in another; it has
#                    happened at least three times in the week to 2026-10-19.
#                    The one that mattered: docs/phase-0-status.md said the
#                    J4 divider disturbs its node by "126 mV (2.7 %)" while
#                    CLAUDE.md said "134 mV (2.9 %)" -- and CLAUDE.md's hard
#                    invariant 1 cites that 2.9 % as the ONLY one of its
#                    three disturbance figures backed by a meter. The wrong
#                    copy sat under the project's top-line safety clause.
#                    Pointers were tried twice and failed: status.md once
#                    carried "CLAUDE.md carries the corner table" AND its
#                    own drifted copy of that table, right beneath it. A
#                    test had not been tried. tools/check-facts.py is it.
#   web            — catches a PWA that no longer builds, which would
#                    otherwise only surface at `make deploy`, and lints the
#                    React. The lint is here because `vite build` is blind to
#                    the class of bug that actually broke this app: a hook
#                    declared below an early return compiles, bundles and
#                    deploys, then throws at runtime the first time the hook
#                    count changes. Four review rounds missed one. eslint
#                    finds it in 300 ms.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# ACTION MAJORS ARE AT THE FIRST NODE-24 RELEASE OF EACH, not the newest tag
# (2026-10-15). Every action here was emitting "targets Node.js 20 but is being
# forced to run on Node.js 24"; these majors are the ones that fix it. Newer
# majors exist -- checkout v6/v7, setup-node v6/v7, setup-go v7, setup-python
# v7, cache v6 -- so this is TWO majors behind on checkout and setup-node, not
# one. They are deliberately not taken: checkout v6 changed credential
# persistence and v7 blocks fork-PR checkout under pull_request_target and
# workflow_run, which is a security-shaped change that deserves its own look.
# "Mostly dependency churn" is true of cache v6 and false of checkout.
#
# ALL FIVE need runner >= 2.327.1, not just cache -- the hosted runner reported
# 2.337.0 on the last green run.
#
# THE ONE REAL BEHAVIOUR CHANGE, found by review after a draft of this comment
# claimed the bumps were checked: setup-go@v6 calls setGoToolchain()
# unconditionally and `core.exportVariable`s **GOTOOLCHAIN=local** into the
# whole job env. server/go.mod says `go 1.27.0` with no `toolchain` directive,
# so Go is pinned to exactly that: a dependency that declares a newer Go now
# FAILS here, where v5 would silently download a toolchain and stay green.
# That is the better behaviour for a repo that pins its BLE stack for the same
# reason -- but if `go vet` ever reports "go.mod requires go >= 1.28", this is
# why, and the fix is a `toolchain` line in go.mod, not a workflow edit.
#
# setup-node@v5's own breaking change does NOT reach us, and a draft gave the
# wrong reason for that. It is not that web/package.json lacks a
# `packageManager` field (it does lack one, but that is not the guard): main.ts
# reads `if (cache && ...) {...} else if (resolvedPackageManager && ...)`, so an
# explicit `cache:` ALWAYS wins and auto-detection can never override it. The
# knob that would disable it is `package-manager-cache: false`.
#
# ALSO DUE: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19. Nothing here
# looks exposed, but the PlatformIO cache key below is `runner.os` ("Linux" on
# both), so a toolchain cached on 24 will restore on 26. That is a pre-existing
# property of the key, not something this change introduced. If `pio run`
# starts failing oddly that week, bust it before looking anywhere else.

# A newer push makes an in-flight run irrelevant; don't leave it running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ONE pin, read by both jobs that need node. The `server` job embeds the
# bundle and the `web` job validates it; pinned separately they could drift,
# which is the same hazard go-version-file avoids for Go below.
env:
  NODE_VERSION: '22'

jobs:
  server:
    name: server (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod rather than pinning it here, so the
          # two can never disagree.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # `make web` runs the Vite build and copies it into internal/web/dist,
      # which is what go:embed picks up. Use the Makefile target rather than
      # repeating the copy here, so the two cannot drift.
      - run: make web
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server

  firmware-logic:
    name: firmware (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ShotDetector and DisplayBus are pure logic with no Arduino
      # dependencies, which is what makes them testable off-target at all.
      - run: make test
        working-directory: firmware/test/host

  firmware-build:
    name: firmware (pio run)
    runs-on: ubuntu-latest
    # A cold run fetches ~1 GB of toolchain. Free, but a hung job should not
    # sit on a runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # No pip cache here on purpose: setup-python's pip caching hashes a
          # requirements.txt / pyproject.toml, and this repo has neither, so
          # enabling it fails the step outright. PlatformIO's own toolchain
          # cache below is the one that actually matters.
      # The espressif32 toolchain is ~1 GB; without this cache every run
      # re-downloads it. Cache storage is free for public repos.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      # secrets.h is gitignored and absent here. That is fine: both call
      # sites guard it with __has_include, so the build must succeed without
      # it — and this job is what proves that stays true.
      - run: pio run
        working-directory: firmware

  facts:
    name: facts (cross-file agreement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No setup-python step: the script is stdlib-only and the hosted
      # runner's python3 is ample. Adding a toolchain here would make the
      # cheapest job in the matrix the slowest one.
      - run: python3 tools/check-facts.py

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Lint before build: a hooks violation is the failure worth reporting,
      # and a broken build would otherwise mask it.
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
