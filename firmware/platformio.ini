; Espresso shot logger — firmware
; Board: ESP32-S3-DevKitC-1 clone, N16R8
;   16 MB quad SPI flash + 8 MB octal SPI PSRAM
;   -> memory_type MUST be qio_opi. Anything else boot-loops.
;   -> GPIO35/36/37 are consumed by the octal PSRAM. Do not use them.

[env:espressolog]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size          = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions          = partitions.csv
board_build.filesystem          = littlefs

; Native USB CDC for the serial monitor. If flashing is unreliable, use
; the UART bridge port on the board instead of the native USB port.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
  h2zero/NimBLE-Arduino
  bblanchon/ArduinoJson
  ; BLE scale protocols — Bookoo Themis is listed as tested.
  ; Vendored rather than pulled, so a library update can't silently
  ; change how shots are measured mid-dataset.
  ; https://github.com/Zer0-bit/esp-arduino-ble-scales
